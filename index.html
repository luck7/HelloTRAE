<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle City - Classic Tank Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        #game-wrapper {
            display: flex;
            gap: 4px;
            background: #333;
            padding: 8px;
            border-radius: 4px;
        }
        #gameCanvas {
            background: #000;
            image-rendering: pixelated;
            display: block;
        }
        #sidebar {
            width: 100px;
            background: #111;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #sidebar h3 {
            font-size: 14px;
            margin: 8px 0 4px;
            color: #fc6;
        }
        #sidebar .info {
            font-size: 12px;
            margin: 2px 0;
            color: #ccc;
        }
        #sidebar .enemy-count {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            width: 54px;
            margin-top: 4px;
        }
        #sidebar .enemy-icon {
            width: 16px;
            height: 16px;
            background: #c44;
            border: 1px solid #822;
        }
        #sidebar .lives-display {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        #sidebar .life-icon {
            width: 16px;
            height: 16px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .overlay h1 {
            font-size: 48px;
            color: #fc6;
            text-shadow: 2px 2px 0 #a60;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }
        .overlay p {
            font-size: 16px;
            color: #ccc;
            margin: 4px 0;
        }
        .overlay button {
            margin-top: 24px;
            padding: 12px 36px;
            font-size: 20px;
            background: #c44;
            color: white;
            border: none;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .overlay button:hover {
            background: #e66;
        }
        .hidden { display: none !important; }
        .stage-num {
            font-size: 24px;
            color: #fff;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="416" height="416"></canvas>
        <div id="sidebar">
            <h3>1P</h3>
            <div class="lives-display" id="livesDisplay"></div>
            <div class="info">Score</div>
            <div class="info" id="scoreDisplay">0</div>
            <h3>Enemies</h3>
            <div class="enemy-count" id="enemyCount"></div>
            <div class="info" style="margin-top:16px">Stage</div>
            <div class="info" id="stageDisplay">1</div>
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>BATTLE CITY</h1>
        <p>Classic FC Tank Battle Remake</p>
        <p>WASD Move | SPACE Shoot</p>
        <p>Protect your base, destroy all enemies</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 id="endTitle">GAME OVER</h1>
        <p id="endReason"></p>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Restart</button>
    </div>

    <div id="stageScreen" class="overlay hidden">
        <h1>STAGE <span id="stageNum">1</span></h1>
        <p>Ready?</p>
    </div>

    <!-- 按依赖顺序加载JS模块 -->
    <script src="js/constants.js"></script>
    <script src="js/images.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/map.js"></script>
    <script src="js/explosion.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/tank.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
